[package]
name = "quicky_notes"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Floating glassmorphism note widget for Hyprland & Wayland"
repository = "https://github.com/amitxd/quicky_notes"
authors = ["amitxd"]
rust-version = "1.97"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
chrono = "0.4"
pulldown-cmark = "0.13"
