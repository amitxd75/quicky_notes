[package]
name = "quicky_notes"
version = "1.0.0"
edition = "2024"

license = "MIT"
description = "Lightweight floating glassmorphism note widget and code scratchpad for Linux"
repository = "https://github.com/amitxd/quicky_notes"
authors = ["amitxd"]
rust-version = "1.97"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
chrono = "0.4"
pulldown-cmark = "0.13"
genai = { version = "0.6.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
egui_extras = { version = "0.36.1", features = ["syntect", "image"] }
arboard = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rhai = { version = "1.25", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
rfd = "0.17"
